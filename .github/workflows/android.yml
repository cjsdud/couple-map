name: Android 빌드

# 사용자가 모바일 단독 환경이라 로컬 빌드가 불가능하다.
# 이 워크플로가 설치 가능한 APK를 만들어 Actions 아티팩트로 올려준다
# (폰에서 바로 내려받아 설치 가능). 스토어 제출용 AAB는 release 입력으로 함께 만든다.
on:
  workflow_dispatch:
    inputs:
      release:
        description: '스토어 제출용 AAB도 함께 만들기 (서명 시크릿 필요)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write # 태그를 밀면 릴리스에 APK를 올린다 (로그인 없이 받는 배포 링크)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - run: npm ci

      # 웹 번들 — 키가 없으면 그 기능이 빠진 채로 패키징되므로 시크릿에서 주입한다
      - name: 웹 빌드
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_KAKAO_REST_KEY: ${{ secrets.VITE_KAKAO_REST_KEY }}
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
        run: npm run build

      - name: Capacitor 동기화
        run: npx cap sync android

      - name: 디버그 APK 빌드
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: dohwaji-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 태그(v1.0.0 등)를 밀면 공개 릴리스로 — 아티팩트와 달리 GitHub 로그인 없이 받을 수 있어
      # 링크만 보내면 짝꿍·지인이 바로 설치할 수 있다 (스토어 없이 배포).
      - name: 릴리스에 APK 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: 우리의 도화지 ${{ github.ref_name }}
          body: |
            안드로이드 설치 파일이에요.

            1. 아래 `app-debug.apk`를 폰으로 받으세요
            2. "출처를 알 수 없는 앱" 안내가 뜨면 허용해 주세요
            3. 설치 후 카카오 또는 이메일로 로그인하면 됩니다

            아이폰은 사파리로 https://couple-map-azure.vercel.app 에 접속한 뒤
            공유 → 홈 화면에 추가로 쓸 수 있어요.

      # ── 스토어 제출용 (서명 필요) ──────────────────────────────
      - name: 서명 키 준비
        if: inputs.release || startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 시크릿이 없어 AAB를 건너뜁니다." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: AAB 빌드
        if: (inputs.release || startsWith(github.ref, 'refs/tags/v')) && hashFiles('android/app/upload-keystore.jks') != ''
        working-directory: android
        env:
          DOHWAJI_STORE_FILE: upload-keystore.jks
          DOHWAJI_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          DOHWAJI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DOHWAJI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: AAB 올리기
        if: (inputs.release || startsWith(github.ref, 'refs/tags/v')) && hashFiles('android/app/upload-keystore.jks') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dohwaji-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
