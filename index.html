<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1: iOS가 입력창 포커스 때 페이지를 강제 확대하는 것 방지 (핀치 줌은 iOS가 계속 허용) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>우리의 도화지</title>
    <meta name="description" content="둘이서 채워가는 우리만의 지도 — 데이트 콕, 오늘 한 장, 우리의 기록" />
    <meta name="theme-color" content="#fdfcf7" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 카톡·SNS 링크 미리보기 (초대 링크의 첫인상) — 커스텀 도메인 생기면 URL 교체 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="우리의 도화지" />
    <meta property="og:description" content="둘이서 채워가는 우리만의 지도 🖍️" />
    <meta property="og:image" content="https://couple-map-azure.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
